<!DOCTYPE html>
<html>

	<head>
		<meta charset="utf-8">
		<title>Div e Span</title>

		<style type="text/css">
			
			#topo{
				background: blue;
			}

			#conteudo{
				background: red;
			}

			#rodape{
				background: green;
			}

			#divisao{
				background: purple;
			}

			.exemplo{
				background: pink;
				color: white;
			}

			.produto{
				background: gray;
				margin: 10px;
			}

		</style>
	</head>

	<body>

		<div id="topo">
			<img src="imagens/amazon.webp" width="200">
			<ul>
					<li>Home</li>
					<li>Produtos</li>
					<li>Contato</li>
			</ul>
		</div>

		<div id="conteudo">
			<div class="produto">
				Produto 1
			</div>

			<div class="produto">
				Produto 2
			</div>

			<div class="produto">
				Produto 3
			</div>
		</div>

		<div id="rodape">
			Todos os direitos reservados
		</div>

		<div id="divisao">
			<span class="exemplo">Exemplo 1</span>
			<span class="exemplo">Exemplo 2</span>
			<span class="exemplo">Exemplo 3</span>
			<span class="exemplo">Exemplo 4</span>
		</div>

	</body>

</html>
